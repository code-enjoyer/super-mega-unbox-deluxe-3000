services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: smud-postgres:latest
    container_name: smud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smud_user
      POSTGRES_PASSWORD: smud_password
      POSTGRES_DB: smud_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smud_user -d smud_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: SuperMegaUnboxDeluxe.Api/Dockerfile
    image: smud-api:latest
    container_name: smud-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SmudDatabase: "Host=postgres;Port=5432;Database=smud_dev;Username=smud_user;Password=smud_password"
    ports:
      - "5000:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: smud-client:latest
    container_name: smud-client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
    driver: local
